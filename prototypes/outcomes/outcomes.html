<title>After This Course</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;1,500&family=Jost:wght@300;400;500&display=swap">
<style>
/* Layout: one sentence the visitor finishes by tapping; the chosen outcome draws itself as a garment flat on pattern paper. */
:root{
  --paper:#F3F1EC; --sheet:#F8F6F2; --grid:#E4E0D7; --ink:#141414; --body:#3B3935; --muted:#8A857C; --line:#D9D5CC;
  --display:"Cormorant Garamond","Iowan Old Style",Georgia,serif;
  --sans:"Jost","Avenir Next","Segoe UI",system-ui,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --paper:#161514; --sheet:#1D1C1A; --grid:#2A2825; --ink:#EEEBE5; --body:#CFCAC1; --muted:#8F8A81; --line:#34312D; color-scheme:dark}}
:root[data-theme="dark"]{--paper:#161514; --sheet:#1D1C1A; --grid:#2A2825; --ink:#EEEBE5; --body:#CFCAC1; --muted:#8F8A81; --line:#34312D; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--body);font-family:var(--sans);font-weight:300;font-size:16px;line-height:1.55;overflow-x:hidden}
.wrap{max-width:1180px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.note{padding-block:18px;border-bottom:1px solid var(--line);font-size:13px;color:var(--muted)}
.out{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.05fr);gap:clamp(24px,5vw,72px);align-items:center;padding-block:clamp(40px,9vh,100px)}
.eyebrow{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted);margin:0 0 18px}
.lead{font-family:var(--display);font-weight:500;color:var(--ink);font-size:clamp(34px,4.6vw,58px);line-height:1.02;margin:0 0 18px;text-wrap:balance}
.list{list-style:none;margin:0;padding:0;display:grid}
.list button{all:unset;box-sizing:border-box;display:flex;align-items:baseline;gap:14px;width:100%;cursor:pointer;padding:6px 0;
  font-family:var(--display);font-style:italic;font-size:clamp(26px,3.3vw,42px);line-height:1.1;color:var(--muted);transition:color .25s}
.list button::before{content:"";flex:0 0 auto;width:22px;height:1px;background:currentColor;transform:translateY(-.3em) scaleX(.35);transform-origin:left;transition:transform .35s}
.list button:hover,.list button[aria-pressed="true"]{color:var(--ink)}
.list button[aria-pressed="true"]::before{transform:translateY(-.3em) scaleX(1)}
.list button:focus-visible{outline:2px solid var(--ink);outline-offset:4px}
.detail{margin:22px 0 0;display:grid;gap:10px;min-height:5.2em}
.detail p{margin:0;max-width:40ch;color:var(--body)}
.tag{justify-self:start;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:4px 12px}
.sheet{position:relative;aspect-ratio:5/6;max-width:100%;background:var(--sheet);border:1px solid var(--line);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;background-position:-1px -1px}
.sheet svg{position:absolute;inset:0;width:100%;height:100%}
.pc{position:absolute;left:16px;top:14px;font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:var(--muted)}
.fig{opacity:0;transition:opacity .3s}
.fig.on{opacity:1}
.ln{fill:none;stroke:var(--ink);stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round;stroke-dasharray:1 1;stroke-dashoffset:1}
.fig.on .ln{transition:stroke-dashoffset 1.5s cubic-bezier(.55,.1,.3,1);stroke-dashoffset:0}
.st{fill:none;stroke:var(--ink);stroke-width:1;stroke-dasharray:4 5;opacity:0}
.dot{fill:var(--ink);opacity:0}
.sign{fill:var(--ink);font-family:var(--display);font-style:italic;opacity:0}
.sign.s{font-family:var(--sans);font-style:normal;letter-spacing:.2em}
.fig.on .st,.fig.on .dot,.fig.on .sign{transition:opacity .6s 1.1s;opacity:.85}
.grain{stroke:var(--muted);stroke-width:1;fill:none}
.name{display:flex;gap:10px;align-items:center;margin-top:14px}
.name label{font-size:13px;color:var(--muted)}
.name input{font:inherit;color:var(--ink);background:var(--sheet);border:1px solid var(--line);border-radius:999px;padding:7px 14px;width:12em}
.name input:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
@media (max-width:760px){
  .out{grid-template-columns:minmax(0,1fr);gap:20px}
  .text{display:contents}
  .head{order:1}.sheet{order:2}.pick{order:3;min-width:0}
  .list{grid-auto-flow:column;grid-auto-columns:max-content;gap:8px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:6px;scrollbar-width:none}
  .list::-webkit-scrollbar{display:none}
  .list button{scroll-snap-align:start;font-style:normal;font-family:var(--sans);font-size:14px;padding:8px 14px;border:1px solid var(--line);border-radius:999px}
  .list button::before{display:none}
  .list button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
  .detail{margin-top:14px}
}
@media (prefers-reduced-motion:reduce){.fig.on .ln,.fig.on .st,.fig.on .dot,.fig.on .sign{transition:none}}
</style>

<script>
const OUT=[
  {id:"blouse",say:"stitch your own blouse",pc:"Blouse · front",tag:"3 & 6 months",
   text:"Princess cut, boat neck, collar and katori blouses, finished with padding, zip or hooks."},
  {id:"lehenga",say:"make a lehenga",pc:"Lehenga · panel flare",tag:"3 & 6 months",
   text:"Panel, umbrella and pleated flares. Fishcut and knot skirts in the 6-month course."},
  {id:"kurta",say:"draft any kurta",pc:"Kurta · placket front",tag:"3 & 6 months",
   text:"Straight, A-line, placket kurta and designer tunic, with puff, petal or waterfall sleeves."},
  {id:"aari",say:"do aari and zardozi work",pc:"Aari · on the frame",tag:"6 months",
   text:"Pearl, bead, zardozi and thread work with the aari needle."},
  {id:"boutique",say:"open your own boutique",pc:"Your shop",tag:"6 months",
   text:"Branding, selling, running a boutique, and where to buy fabric in the local market."},
  {id:"studio",say:"work at a boutique or studio",pc:"Studio rail",tag:"3 & 6 months",
   text:"Measure, draft, cut and finish garments the way working designers do."},
];
const list=document.getElementById("list"),dText=document.getElementById("dText"),dTag=document.getElementById("dTag"),
  pc=document.getElementById("pc"),nameRow=document.getElementById("nameRow");
let cur=-1,auto=true,timer=null,seen=false;
const btns=OUT.map((o,i)=>{const li=document.createElement("li"),b=document.createElement("button");
  b.type="button";b.textContent=o.say;b.setAttribute("aria-pressed","false");
  b.onclick=()=>{auto=false;clearInterval(timer);show(i)};li.appendChild(b);list.appendChild(li);return b});

function show(i){
  if(i===cur)return;
  if(cur>=0){document.getElementById("f-"+OUT[cur].id).classList.remove("on");btns[cur].setAttribute("aria-pressed","false")}
  cur=i;const o=OUT[i],f=document.getElementById("f-"+o.id);
  // restart the drawing: force the hidden state to apply before turning it on
  f.getBoundingClientRect();requestAnimationFrame(()=>f.classList.add("on"));
  btns[i].setAttribute("aria-pressed","true");
  if(!auto)btns[i].scrollIntoView({block:"nearest",inline:"nearest",behavior:"smooth"});
  dText.textContent=o.text;dTag.textContent=o.tag;pc.textContent=o.pc;nameRow.hidden=o.id!=="boutique";
}
const sign=document.getElementById("signName");
document.getElementById("shopName").addEventListener("input",e=>{sign.textContent=e.target.value.trim()||"Priya"});

function cycle(){if(auto&&seen&&!document.hidden)show((cur+1)%OUT.length)}
new IntersectionObserver(es=>{seen=es[0].isIntersecting},{threshold:.4}).observe(document.getElementById("sheet"));
show(0);
if(!matchMedia("(prefers-reduced-motion: reduce)").matches)timer=setInterval(cycle,4200);
</script>
